server {
    listen 80;
    server_name localhost;

    # Serve the main web application (index.html, style.css, app.js, quotes.csv)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Route searchService.js to the search-service container
    location = /searchService.js {
        proxy_pass http://search-service:80/searchService.js;
        proxy_set_header Host $host;
    }

    # Route cartService.js to the cart-service container
    location = /cartService.js {
        proxy_pass http://cart-service:80/cartService.js;
        proxy_set_header Host $host;
    }
}
